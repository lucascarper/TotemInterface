services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: totem
      POSTGRES_PASSWORD: totem
      POSTGRES_DB: totem
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U totem"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://totem:totem@db:5432/totem
      AUTO_CREATE_SCHEMA: "false"
      CORS_ORIGINS: http://localhost:8080
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ""   # vazio: nginx faz proxy de /totem, /admin e /health para a api
    depends_on:
      - api
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  pgdata:
