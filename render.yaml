# Blueprint do Render: API, front e PostgreSQL. Guia em docs/deploy-render.md.
# Mesma arquitetura que funcionou no Railway: front e API em domínios próprios (CORS).
# Os dois serviços ficam em plano pago: no gratuito eles "dormem" sem uso, e a API
# roda a sincronização com o SGG em segundo plano.

services:
  - type: web
    name: totem-api
    runtime: docker
    region: virginia
    plan: 0.5c-512mb
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      # O Dockerfile já roda `alembic upgrade head` antes de subir a API.
      - key: AUTO_CREATE_SCHEMA
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: totem-db
          property: connectionString
      - key: SGG_MODE
        value: http
      - key: SGG_BASE_URL
        value: https://app.sgg.net.br/api/v3/
      - key: SGG_TIMEOUT_SECONDS
        value: "15"
      - key: SYNC_INTERVAL_SECONDS
        value: "300"
      - key: ADMIN_USERNAME
        value: admin
      - key: JWT_SECRET
        generateValue: true
      # Preenchidos por você na criação do Blueprint (nunca no repositório).
      - key: SGG_API_KEY
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: TOTEM_API_KEY
        sync: false
      # URL pública do front, ex.: https://totem-web.onrender.com
      - key: CORS_ORIGINS
        sync: false

  - type: web
    name: totem-web
    runtime: docker
    region: virginia
    plan: 0.5c-512mb
    # Build do Vite + `serve` com fallback de SPA, escutando em $PORT (vale para o Render).
    dockerfilePath: ./frontend/Dockerfile.railway
    dockerContext: ./frontend
    healthCheckPath: /
    envVars:
      # Lidos no build (o Render repassa como build args). URL pública da API,
      # ex.: https://totem-api.onrender.com. Mudou? Faça um novo deploy do totem-web.
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_TOTEM_API_KEY
        sync: false

databases:
  - name: totem-db
    region: virginia
    plan: 0.1c-256mb
    postgresMajorVersion: "16"
