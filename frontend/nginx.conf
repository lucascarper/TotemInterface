server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # API (mesma origem: evita CORS e esconde o backend do tablet).
    # Encaminha tudo sob /totem e /admin — não enumerar endpoints aqui, ou um
    # endpoint novo na API passa a dar 404 silenciosamente através do nginx.
    location /totem/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /admin/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location = /health { proxy_pass http://api:8000; }

    # SPA
    location / { try_files $uri $uri/ /index.html; }
    location /sw.js { add_header Cache-Control "no-cache"; }
    location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
}
